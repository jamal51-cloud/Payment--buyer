<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALL PAYMENT ANGTUNE</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  /* Background tetap, blur dikurangi di container */
  background:url('https://cdn.phototourl.com/free/2026-04-17-5df70949-a7b3-4afd-a294-a1d72fe226eb.jpg') no-repeat center/cover;
  overflow:hidden;
}

.overlay{
  position:absolute;
  width:100%;
  height:100%;
  /* Mengurangi kegelapan overlay agar BG lebih tampak */
  background:linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.6));
}

/* sparkle */
.sparkle{
  position:absolute;
  width:5px;
  height:5px;
  background:#ffd700;
  border-radius:50%;
  animation:spark 4s linear infinite;
  opacity:0.8;
}

@keyframes spark{
  0%{transform:translateY(0) scale(0);opacity:0;}
  50%{opacity:1;}
  100%{transform:translateY(-250px) scale(1.5);opacity:0;}
}

.container{
  position:relative;
  width:340px;
  padding:25px;
  border-radius:22px;
  z-index:2;
  text-align:center;
  /* Blur dikurangi dari 10px ke 3px agar BG tembus pandang */
  backdrop-filter:blur(3px);
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.1);
}

/* logo */
.logo{
  font-size:26px;
  font-weight:700;
  background:linear-gradient(90deg,#ffd700,#fff,#ffd700);
  background-size:200%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shineText 4s linear infinite, floatLogo 4s ease-in-out infinite;
  text-shadow:0 0 25px rgba(255,215,0,0.7);
}

@keyframes shineText{
  0%{background-position:0%;}
  100%{background-position:200%;}
}

@keyframes floatLogo{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-6px);}
}

.tagline{
  font-size:12px;
  color:#eee;
  margin-bottom:18px;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
}

/* card */
.card{
  background:rgba(0, 0, 0, 0.5);
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
  border:1px solid rgba(255,215,0,0.3);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px) scale(1.03);
  box-shadow:0 10px 35px rgba(0,0,0,0.7),
             0 0 25px rgba(255,215,0,0.5);
}

.method{
  font-weight:600;
  color:#fff;
}

.number{
  font-size:14px;
  margin-top:4px;
  color:#eee;
}

/* button */
.copy, .view-qr{
  margin-top:8px;
  padding:6px 12px;
  border:none;
  border-radius:8px;
  background:#ffd700;
  color:black;
  font-size:12px;
  font-weight: 600;
  cursor:pointer;
}

/* Modal QR */
#qrModal {
  display: none;
  position: fixed;
  z-index: 10;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

#qrModal img {
  width: 280px;
  border-radius: 15px;
  border: 5px solid #ffd700;
}

.close-modal {
  margin-top: 20px;
  color: white;
  background: #ff4444;
  padding: 8px 20px;
  border-radius: 8px;
  cursor: pointer;
}

/* WA */
.wa{
  display:block;
  margin-top:14px;
  padding:12px;
  border-radius:12px;
  text-decoration:none;
  font-weight:600;
  background:#25D366;
  color:white;
  transition:0.3s;
}

.wa:hover{
  transform:translateY(-3px);
  box-shadow:0 0 15px rgba(37,211,102,0.7);
}

/* MUSIC BUTTON */
.music-btn{
  position:absolute;
  top:15px;
  right:15px;
  width:45px;
  height:45px;
  border-radius:50%;
  background:#ffd700;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  box-shadow:0 0 15px rgba(255,215,0,0.7);
  z-index: 100;
}

.footer{
  margin-top:12px;
  font-size:11px;
  color:#fff;
  text-shadow: 1px 1px 2px black;
}
</style>
</head>

<body>

<div class="overlay"></div>

<audio id="music" autoplay loop>
  <source src="https://www.image2url.com/r2/default/audio/1776405271383-3a0a21f3-0333-4a15-afa1-46a3867ab4d9.m4a">
</audio>

<div class="music-btn" onclick="toggleMusic()">🎵</div>

<div class="container">
  <div class="logo">ALL PAYMENT ANGTUNE</div>
  <div class="tagline">All Payment Ready • Fast & Trusted</div>

  <div class="card">
    <div class="method">DANA</div>
    <div class="number" id="dana">085600467153</div>
    <button class="copy" onclick="copyText('dana')">Salin Nomor</button>
  </div>

  <div class="card">
    <div class="method">GOPAY</div>
    <div class="number" id="gopay">085600467153</div>
    <button class="copy" onclick="copyText('gopay')">Salin Nomor</button>
  </div>

  <div class="card">
    <div class="method">QRIS PAYMENT</div>
    <div class="number">Otomatis Terdeteksi</div>
    <button class="view-qr" onclick="openQR()">Klik Lihat QRIS</button>
  </div>

  <a class="wa" href="https://wa.me/6285600467153" target="_blank">Hubungi Admin</a>
  <div class="footer">© 2026 BRAND MOD</div>
</div>

<div id="qrModal" onclick="closeQR()">
  <img src="https://cdn.phototourl.com/free/2026-04-17-b4c4b98e-f4f6-494f-95a7-5dde9ed45d3b.jpg" alt="QRIS ANGTUNE">
  <div class="close-modal">Tutup</div>
</div>

<script>
function copyText(id){
  let text=document.getElementById(id).innerText;
  navigator.clipboard.writeText(text);
  alert("Nomor " + id.toUpperCase() + " berhasil disalin!");
}

function openQR() {
  document.getElementById("qrModal").style.display = "flex";
}

function closeQR() {
  document.getElementById("qrModal").style.display = "none";
}

let music = document.getElementById("music");
function toggleMusic(){
  if(music.paused){
    music.play();
  } else {
    music.pause();
  }
}
</script>

</body>
</html>
